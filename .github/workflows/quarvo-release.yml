# Builds the quarvo-workerd OCI image (workerd + per-isolate limit-enforcement patch) and pushes it
# to GHCR. quarvo pins an exact tag and COPYs the binary in its runner/Dockerfile.
#
# IMPORTANT — runner size: a *cold* vendored-V8 build needs far more than a standard GitHub-hosted
# runner provides (standard ubuntu-latest is ~4 cores / 16 GB RAM / ~14 GB free disk, which is not
# enough — see quarvo/MAINTENANCE.md). Use a LARGER runner: a bigger GitHub-hosted runner label
# (e.g. an org `ubuntu-latest-16-core`), a self-hosted runner, or a third-party large runner, AND a
# persistent Bazel disk cache so only the first build pays full cost. The `Free disk space` step
# below reclaims a few GB on standard runners but does not make a cold build fit on its own.
name: quarvo-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 1.20260623.1-quarvo.1 (upstream tag + -quarvo.N)"
        required: true
  push:
    tags:
      - "v*-quarvo.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Override with a larger runner label for the cold build (see header note).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"   # strip leading v from the pushed tag
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quarvo-workerd" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quarvo/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          # A persistent registry/gha cache makes incremental rebuilds cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max
