# Builds the quarvo-workerd OCI image (workerd + per-isolate limit-enforcement patch) for BOTH
# linux/amd64 and linux/arm64 and pushes a single multi-arch manifest to GHCR, so one tag
# (…:<version>) resolves to the right architecture automatically.
#
# Each arch is built NATIVELY (no QEMU): amd64 on ubuntu-latest, arm64 on GitHub's free
# `ubuntu-24.04-arm` runner (public repos). The thin runtime image runs `workerd --version`, so each
# arch's binary is smoke-tested during the build.
#
# FAST REBUILDS (Bazel disk cache): a cold vendored-V8 build is ~3 h per arch, but ~99% of the
# ~8,500 build actions (V8/abseil/ICU/boringssl) are identical across our fork's commits. We persist
# Bazel's --disk_cache across runs with actions/cache, so a rebuild that only touches the enforcement
# C++ finishes in MINUTES (cache hits for V8; only the changed files recompile + relink). The heavy
# compile runs inside quarvo/Dockerfile's `export` target, which emits the binary + the updated disk
# cache to a local dir; the thin quarvo/Dockerfile.runtime is then built from that binary and pushed
# by digest, so the expensive compile happens exactly once per build. See quarvo/MAINTENANCE.md
# "CI build caching".
#
# WHY THIS RUNS ON quarvo-main TOO: GitHub scopes the Actions cache per ref. Each release is a new
# `v*-quarvo.*` tag = a new ref, and a run can only restore caches from its own ref or the DEFAULT
# branch — so a previous release's cache is invisible to the next one. To fix that, a push to
# quarvo-main is a CACHE-WARM run: it builds and SAVES the disk cache under the default-branch scope
# (publishing nothing). Tag releases then RESTORE that default-branch cache and run warm. Flow: merge
# to quarvo-main (warms the cache) → tag the release (fast). The first quarvo-main build is cold.
#
# RUNNER SIZE: see quarvo/MAINTENANCE.md. The "Reclaim disk space" step frees ~25-30 GB so the
# build fits on the standard hosted runners; for reliability/speed switch `runner:` to larger labels.
name: quarvo-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 1.20260623.1-quarvo.1 (upstream tag + -quarvo.N)"
        required: true
  pull_request:
    branches: [quarvo-main]
  push:
    # Cache-warm runs. GitHub scopes the Actions cache PER REF: a release (each a distinct
    # `v*-quarvo.*` tag = a distinct ref) can only restore caches from its own ref or the DEFAULT
    # branch. So a push to quarvo-main builds and SAVES the Bazel disk cache under the default-branch
    # scope; tag releases then RESTORE it (and skip saving). A quarvo-main push does NOT push an image.
    branches:
      - quarvo-main
    tags:
      - "v*-quarvo.*"

# Never run two builds for the same ref at once. PR runs are safely cancelable (they never save the
# cache nor publish an image), so a newer push to the same PR cancels the in-flight run. quarvo-main
# and tag runs must still run to COMPLETION (a cache-warm run finishes and SAVES the cache instead of
# being killed); newer pushes to those refs queue and supersede each other (only the latest pending
# survives), so duplicate ~3h cold builds don't pile up. Per-ref grouping: cache-warm runs on
# quarvo-main serialize with each other, while each release tag is its own group and runs
# independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/edutivo/quarvo-workerd
  # Extra/override test targets for the quarvo-test stage; empty = Dockerfile default list.
  QUARVO_TEST_TARGETS: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      # A RELEASE run (tag push or manual dispatch) publishes the image. A push to quarvo-main is a
      # CACHE-WARM run: it builds + saves the default-branch-scoped cache but publishes nothing.
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Restore the per-arch Bazel disk cache. Exact key preferred; when a key rotation (a change to
      # one of the hashed files, e.g. quarvo/Dockerfile) misses it, the restore-keys prefix seeds
      # from the newest previous cache instead of a ~3h cold build. Snowballing is bounded by the
      # Dockerfile's >100MB-entry trim and GitHub's 10GB LRU eviction. amd64 and arm64 action hashes
      # differ, so the per-arch prefix keeps them from ever sharing an entry. Split restore/save
      # (not the integrated cache) so a FAILED build can't poison the key with a partial/empty cache;
      # save still uses the exact key and runs on quarvo-main only.
      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ matrix.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'quarvo/Dockerfile') }}
          # Fallback prefix: rotating the hashed key (e.g. a quarvo/Dockerfile edit) seeds from the
          # newest previous cache instead of going cold. Restore-only — the save step below still
          # uses the exact key and stays gated to quarvo-main, so the cache doesn't snowball in size.
          restore-keys: |
            bazel-disk-${{ matrix.arch }}-

      - name: Build workerd + export updated Bazel cache (${{ matrix.arch }})
        env:
          RUN_QUARVO_TESTS: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/quarvo-main' }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bazel-disk-cache"            # cold run: empty seed for --build-context
          echo "Restored disk cache size:"; du -sh "$HOME/bazel-disk-cache" || true
          rm -rf "$RUNNER_TEMP/out"
          # Heavy compile inside the validated node:trixie builder, seeding --disk_cache from the
          # restored cache and emitting the binary + updated (already-trimmed) cache to a local dir.
          # Native arch (no --platform): runs on the matching matrix runner, so no QEMU.
          docker buildx build \
            --target export \
            --build-context bazelcache="$HOME/bazel-disk-cache" \
            --output type=local,dest="$RUNNER_TEMP/out" \
            --file quarvo/Dockerfile \
            .
          # TIGHTEST DISK POINT: the heavy build keeps buildkit state AND this local export
          # co-resident on '/'. An ENOSPC here surfaces as a confusing ~3h-in compile/link failure,
          # so log the numbers to make it diagnosable. See MAINTENANCE.md "CI build caching" for the
          # peak-disk reality + escape hatches (bigger runner / relocate to /mnt) if this ever trips.
          echo "Disk after export build:"; df -h / || true
          # Run the quarvo test targets on PR / quarvo-main runs. Same Dockerfile + SAME
          # bazelcache build-context as the export build above => buildkit reuses every builder
          # layer and only the new `RUN bazel test` executes (the builder layer already holds the
          # fully-built bazel output tree, so the tests build/run incrementally in minutes).
          # Must run BEFORE the cache swap below: swapping the build-context content would
          # invalidate the COPY --from=bazelcache layer and force a rebuild of the whole stage.
          if [ "$RUN_QUARVO_TESTS" = "true" ]; then
            docker buildx build \
              --target quarvo-test \
              --build-context bazelcache="$HOME/bazel-disk-cache" \
              ${QUARVO_TEST_TARGETS:+--build-arg QUARVO_TEST_TARGETS="$QUARVO_TEST_TARGETS"} \
              --file quarvo/Dockerfile \
              .
            echo "quarvo test targets passed"
          fi
          df -h / || true
          # Replace the restored cache with the freshly-built one so the save step persists it.
          # Moving it out of $RUNNER_TEMP/out also keeps the thin runtime build context tiny.
          rm -rf "$HOME/bazel-disk-cache"
          mv "$RUNNER_TEMP/out/bazel-disk-cache" "$HOME/bazel-disk-cache"
          echo "Disk cache size to persist:"; du -sh "$HOME/bazel-disk-cache" || true
          # Reclaim the multi-GB buildkit layers before the thin build + cache tar.
          docker buildx prune -af || true
          df -h / || true

      # Everything below this point only runs for a RELEASE (tag push / manual dispatch). On a
      # quarvo-main cache-warm run the steps above already built + (via the Save step) persisted the
      # cache, which is the whole point; there is nothing to publish.
      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the thin runtime image from the already-compiled binary (no second compile) and push it
      # by digest, exactly as before. The digest feeds the unchanged `merge` job's manifest.
      - name: Build and push thin runtime image by digest (${{ matrix.arch }})
        id: build
        if: env.IS_RELEASE == 'true'
        run: |
          set -euxo pipefail
          # --provenance/--sbom=false: raw buildx attaches a provenance attestation by default, which
          # adds an `unknown/unknown` entry to a push-by-digest image and complicates the manifest the
          # `merge` job assembles. Disabling it keeps the published image identical in shape to the
          # previous build-push-action output (which defaulted attestations off).
          docker buildx build \
            --file quarvo/Dockerfile.runtime \
            --platform "${{ matrix.platform }}" \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/runtime-meta.json" \
            "$RUNNER_TEMP/out"
          digest="$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/runtime-meta.json")"
          test -n "$digest" && test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Persist the cache ONLY when running on the default branch (refs/heads/quarvo-main) so it lands
      # in the scope that tag releases can restore — saving under a tag's own ref would be useless and
      # would burn the 10 GB repo budget. Also gated on a cold MISS (exact-key entries are immutable)
      # and on success (default `if: success()`), so a broken build never overwrites a good cache.
      - name: Save Bazel disk cache
        if: github.ref == 'refs/heads/quarvo-main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Export digest
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    # Only assemble + publish the multi-arch manifest for a RELEASE; a quarvo-main cache-warm run has
    # no digests to merge (the build job skipped the push).
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.meta.outputs.version }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect (confirm amd64 + arm64)
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Capture multi-arch index digest
        id: digest
        run: |
          set -euo pipefail
          d=$(docker buildx imagetools inspect \
                "${IMAGE}:${{ steps.meta.outputs.version }}" \
                --format '{{json .Manifest}}' | jq -r '.digest')
          [ -n "$d" ]
          [ "$d" != "null" ]
          echo "index_digest=${d}" >> "$GITHUB_OUTPUT"
          {
            echo "### quarvo-workerd ${{ steps.meta.outputs.version }}"
            echo "- tag: \`${IMAGE}:${{ steps.meta.outputs.version }}\`"
            echo "- multi-arch index digest: \`${d}\`"
            echo "- pin: \`${IMAGE}@${d}\`"
          } >> "$GITHUB_STEP_SUMMARY"
