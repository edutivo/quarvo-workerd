# Builds the quarvo-workerd OCI image (workerd + per-isolate limit-enforcement patch) and pushes it
# to GHCR. quarvo pins an exact tag and COPYs the binary in its runner/Dockerfile.
#
# IMPORTANT — runner size. A *cold* vendored-V8 build is heavy. For reference, upstream workerd's own
# CI builds on `ubuntu-22.04-16core` (a 16-core larger runner) with a Bazel disk cache AND a private
# remote cache; standard `ubuntu-latest` (4 cores / 16 GB RAM / ~14 GB disk) is used only for light
# jobs. A fork has no access to that remote cache, so the first build is fully cold.
#   * Public repo? GitHub-hosted minutes are free, so trying `ubuntu-latest` first costs nothing —
#     the "Reclaim disk space" step below frees ~25-30 GB, which usually makes it FIT on disk, but
#     expect a slow (~1 h+) build and possible RAM pressure during the V8 link.
#   * For reliable/fast builds, switch `runs-on:` to a LARGER runner your org has enabled (e.g.
#     `ubuntu-22.04-16core`) or a self-hosted runner on a >=8-core / >=32 GB / >=60 GB-disk host.
# See quarvo/MAINTENANCE.md.
name: quarvo-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 1.20260623.1-quarvo.1 (upstream tag + -quarvo.N)"
        required: true
  push:
    tags:
      - "v*-quarvo.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Override with a larger runner label for the cold build (see header note).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"   # strip leading v from the pushed tag
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quarvo-workerd" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quarvo/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          # A persistent registry/gha cache makes incremental rebuilds cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max
