# Pulls the published quarvo-workerd OCI image and runs the per-isolate memory-enforcement test
# (worker-loader-memory-test) against the ACTUAL shipped binary, on BOTH architectures natively
# (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm — each pulls the matching entry from the
# multi-arch manifest). Uses the built-in GITHUB_TOKEN, which can read the repo's own (even private)
# GHCR package, so this needs no public visibility or extra secrets. Trigger: push an `imgtest-*` tag.
name: quarvo-image-test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test (memory-ratchet requires >= 1.20260623.1-quarvo.4)"
        default: "1.20260623.1-quarvo.4"
        required: true
  push:
    tags:
      - "imgtest-*"

permissions:
  contents: read
  packages: read

jobs:
  test-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run memory-enforcement test against the published image (${{ matrix.arch }})
        run: |
          set -euxo pipefail
          TAG="${{ github.event.inputs.image_tag || '1.20260623.1-quarvo.4' }}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quarvo-workerd:${TAG}"
          # docker pull resolves the multi-arch manifest to this runner's architecture.
          docker pull "$IMG"
          docker run --rm "$IMG" --version
          echo "host arch: $(uname -m)"

          mkdir -p "$RUNNER_TEMP/t"
          cp src/workerd/api/tests/worker-loader-memory-test.wd-test "$RUNNER_TEMP/t/test.wd-test"
          cp src/workerd/api/tests/worker-loader-memory-test.js "$RUNNER_TEMP/t/worker-loader-memory-test.js"

          # `workerd test` runs the exported test() handlers (MEM-1/2/3, REG-1) and exits non-zero on
          # any failed assertion — so a green job == the shipped binary enforces the memory cap.
          docker run --rm -v "$RUNNER_TEMP/t:/t" -w /t "$IMG" \
            test --predictable /t/test.wd-test --experimental --compat-date=2000-01-01

  memory-ratchet:
    # Dispatch-only: the on-phase requires an image >= 1.20260623.1-quarvo.4 (older images ignore
    # the env vars and OOM the capped container); run via dispatch with an explicit image_tag.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ratchet e2e — off reproduces, on stays bounded
        run: |
          set -euxo pipefail
          TAG="${{ github.event.inputs.image_tag || '1.20260623.1-quarvo.4' }}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quarvo-workerd:${TAG}"
          docker pull "$IMG"
          bash quarvo/e2e/ratchet/run.sh "$IMG" off
          bash quarvo/e2e/ratchet/run.sh "$IMG" on

  meter-overhead:
    # Dispatch-only: requires an image >= 1.20260623.1-quarvo.5 (older images have no metering
    # and no boot banner, so the banner/getStats assertions would fail by construction).
    # The <=MAX_REGRESSION_PCT bound is a loose regression tripwire — shared runners are too
    # noisy to assert the honest 1-2% target; that number comes from a quiet-host run and is
    # published in quarvo/FEATURES.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metering overhead — off vs on throughput + banner contract
        run: |
          set -euxo pipefail
          TAG="${{ github.event.inputs.image_tag || '1.20260623.1-quarvo.4' }}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quarvo-workerd:${TAG}"
          docker pull "$IMG"
          bash quarvo/e2e/meter-overhead/run.sh "$IMG" off
          bash quarvo/e2e/meter-overhead/run.sh "$IMG" on
          OFF=$(cat /tmp/meter-overhead-rps-off); ON=$(cat /tmp/meter-overhead-rps-on)
          PCT=$(echo "scale=2; (1 - $ON / $OFF) * 100" | bc)
          echo "metering overhead: ${PCT}% (off=${OFF} rps, on=${ON} rps)"
          MAX_REGRESSION_PCT="${MAX_REGRESSION_PCT:-10}"
          test "$(echo "$PCT < $MAX_REGRESSION_PCT" | bc)" = "1" || {
            echo "FAIL: metering overhead ${PCT}% exceeds ${MAX_REGRESSION_PCT}% bound"; exit 1; }
